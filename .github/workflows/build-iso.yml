name: Build ark Installer ISO

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build regardless of digest'
        default: true
        type: boolean

concurrency:
  group: ark-iso-release
  cancel-in-progress: false

env:
  CACHE_KEY_PREFIX: iso-digest-v2

jobs:
  check-digest:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      needs-build: ${{ steps.decide.outputs.needs-build }}
      reason: ${{ steps.decide.outputs.reason }}
      digest: ${{ steps.digest.outputs.value }}
      aur-sha: ${{ steps.aur.outputs.sha }}
      aur-release-id: ${{ steps.aur.outputs.release-id }}
      alga-sha: ${{ steps.alga.outputs.sha }}
      alga-url: ${{ steps.alga.outputs.url }}
    steps:
      - uses: actions/checkout@v6
      - name: Get current archlinux:latest digest
        id: digest
        run: |
          TOKEN=$(curl -fsS 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/archlinux:pull' | jq -er '.token')
          DIGEST=$(curl -fsSI \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            https://registry-1.docker.io/v2/library/archlinux/manifests/latest | \
            awk 'tolower($1) == "docker-content-digest:" {gsub("\r", "", $2); print $2}')
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Missing Arch image digest' >&2; exit 1; }
          echo "value=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Check published ark-aur release
        id: aur
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/workflows/download-aur-release.py --kind identity

      - name: Check published alga release
        id: alga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATA=$(gh api repos/zamkara/alga/releases/latest)
          ID=$(printf '%s' "$DATA" | jq -er '.id')
          URL=$(printf '%s' "$DATA" | jq -er '[.assets[] | select(.name | endswith(".pkg.tar.zst")) | select(.name | contains("-debug-") | not)] | if length == 1 then .[0].browser_download_url else error("Expected one release package") end')
          echo "sha=$ID" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "ci=success" >> "$GITHUB_OUTPUT"

      - name: Restore cached digest
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: digest-cache.txt
          key: ${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}-
          fail-on-cache-miss: false

      - name: Decide whether to build
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "needs-build=true" >> $GITHUB_OUTPUT
            echo "reason=push" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "needs-build=true" >> $GITHUB_OUTPUT
            echo "reason=force" >> $GITHUB_OUTPUT
            exit 0
          fi

          CURRENT="${{ steps.digest.outputs.value }}"
          AUR_CURRENT="${{ steps.aur.outputs.sha }}"
          AUR_CI="${{ steps.aur.outputs.ci }}"
          ALGA_CURRENT="${{ steps.alga.outputs.sha }}"
          ALGA_CI="${{ steps.alga.outputs.ci }}"

          CACHED=""
          AUR_CACHED=""
          ALGA_CACHED=""
          CACHED_TS=""
          if [ -f digest-cache.txt ]; then
            CACHED=$(sed -n '1p' digest-cache.txt)
            AUR_CACHED=$(sed -n '2p' digest-cache.txt)
            ALGA_CACHED=$(sed -n '3p' digest-cache.txt)
            CACHED_TS=$(sed -n '4p' digest-cache.txt)
          fi

          NOW=$(date +%s)
          needs_build="false"
          reason="skip-no-change"

          if [ -z "$CACHED" ]; then
            needs_build="true"
            reason="initial-build"
          elif [ "$CURRENT" != "$CACHED" ]; then
            needs_build="true"
            reason="update-archlinux"
          elif [ "$AUR_CURRENT" != "$AUR_CACHED" ] && [ "$AUR_CI" = "success" ]; then
            needs_build="true"
            reason="update-aur"
          elif [ "$ALGA_CURRENT" != "$ALGA_CACHED" ] && [ "$ALGA_CI" = "success" ]; then
            needs_build="true"
            reason="update-alga"
          elif [ -n "$CACHED_TS" ] && [ $((NOW - CACHED_TS)) -gt $((7 * 86400)) ]; then
            needs_build="true"
            reason="weekly-fallback"
          fi

          echo "archlinux: cached=$CACHED current=$CURRENT"
          echo "ark-aur: cached=$AUR_CACHED current=$AUR_CURRENT ci=$AUR_CI"
          echo "alga: cached=$ALGA_CACHED current=$ALGA_CURRENT ci=$ALGA_CI"

          echo "needs-build=$needs_build" >> $GITHUB_OUTPUT
          echo "reason=$reason" >> $GITHUB_OUTPUT

  build-iso:
    needs: [check-digest]
    if: needs.check-digest.outputs.needs-build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up dependencies
        run: sudo apt-get update && sudo apt-get install -y podman wget curl jq
      - name: Download AUR packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/workflows/download-aur-release.py --kind packages \
            --release-id '${{ needs.check-digest.outputs.aur-release-id }}' \
            --destination aur-packages
      - name: Download Alga Package
        env:
          PACKAGE_URL: ${{ needs.check-digest.outputs.alga-url }}
        run: curl -fL --retry 3 --connect-timeout 15 --max-time 300 "$PACKAGE_URL" -o aur-packages/alga.pkg.tar.zst
      - name: Download ark-backgrounds Package
        run: |
          cd aur-packages
          python3 << 'EOF' | wget -qi -
          import urllib.request, json
          req = urllib.request.Request(
              "https://api.github.com/repos/zamkara/ark-backgrounds/releases/latest",
              headers={"User-Agent": "Ark"}
          )
          data = json.loads(urllib.request.urlopen(req).read().decode())
          for a in data.get("assets", []):
              if a["name"].endswith(".pkg.tar.zst") and "debug" not in a["name"]:
                  print(a["browser_download_url"])
                  break
          EOF
          cd ..
      - name: Cache Pacman ISO
        uses: actions/cache@v4
        with:
          path: pacman-cache/
          key: ${{ runner.os }}-pacman-iso-${{ hashFiles('.github/workflows/archiso/packages.x86_64') }}
          restore-keys: |
            ${{ runner.os }}-pacman-iso-
      - name: Prepare Cache Dirs
        run: mkdir -p pacman-cache
      - name: Build Live Installer ISO
        run: |
          chmod +x .github/workflows/build_iso.sh
          sudo podman run --rm --privileged -v $(pwd):/work -v $(pwd)/pacman-cache:/var/cache/pacman/pkg -w /work docker.io/archlinux:latest bash /work/.github/workflows/build_iso.sh
          sudo chown -R $USER:$USER out/ pacman-cache/
          mv out/*.iso out/ark-installer.iso
      - name: Upload ISO Workspace Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ark-iso-internal
          path: out/ark-installer.iso
          if-no-files-found: error

  upload-github:
    needs: build-iso
    runs-on: ubuntu-latest
    steps:
      - name: Download ISO Workspace Artifact
        uses: actions/download-artifact@v4
        with:
          name: ark-iso-internal
          path: out/
      - name: Upload ISO to Github Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ark-iso
          path: out/ark-installer.iso
          if-no-files-found: error

  upload-mirror:
    needs: build-iso
    runs-on: ubuntu-latest
    outputs:
      DOWNLOAD_URL: ${{ steps.ranoz-upload.outputs.DOWNLOAD_URL }}
      EXPIRATION_DATE: ${{ steps.ranoz-upload.outputs.EXPIRATION_DATE }}
    steps:
      - name: Download ISO Workspace Artifact
        uses: actions/download-artifact@v4
        with:
          name: ark-iso-internal
          path: out/
      - name: Upload to Ranoz
        id: ranoz-upload
        run: |
          # disable "exit on error" so upload problems don't fail the job
          set +e

          FILE_PATH="out/ark-installer.iso"
          FILENAME="ark-installer-${{ github.sha }}.iso"

          if [ ! -f "$FILE_PATH" ]; then
            echo "Ranoz: file not found, skipping mirror" >&2
            echo "DOWNLOAD_URL=" >> $GITHUB_OUTPUT
            echo "EXPIRATION_DATE=" >> $GITHUB_OUTPUT
            exit 0
          fi

          SIZE=$(stat -c%s "$FILE_PATH")

          RESPONSE=$(curl -s -X POST https://ranoz.gg/api/v1/files/upload_url -H "Content-Type: application/json" -d "{
            \"filename\": \"$FILENAME\",
            \"size\": $SIZE
          }")

          UPLOAD_URL=$(echo "$RESPONSE" | jq -r '.data.upload_url // empty')
          FILE_ID=$(echo "$RESPONSE" | jq -r '.data.id // empty')
          FILE_URL=$(echo "$RESPONSE" | jq -r '.data.url // empty')

          if [ -z "$UPLOAD_URL" ]; then
            echo "Ranoz: failed to get upload URL, skipping mirror" >&2
            echo "DOWNLOAD_URL=" >> $GITHUB_OUTPUT
            echo "EXPIRATION_DATE=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Uploading $FILENAME ($SIZE bytes)..."
          curl -T "$FILE_PATH" "$UPLOAD_URL"
          UPLOAD_EXIT=$?
          if [ $UPLOAD_EXIT -ne 0 ]; then
            echo "Ranoz: upload failed (curl exit $UPLOAD_EXIT), skipping mirror" >&2
            echo "DOWNLOAD_URL=" >> $GITHUB_OUTPUT
            echo "EXPIRATION_DATE=" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -z "$FILE_URL" ] && [ -n "$FILE_ID" ]; then
            FILE_URL="https://ranoz.gg/api/v1/files/$FILE_ID"
          fi

          EXP_DATE=$(date -d "+1 month" "+%d %B %Y")
          echo "DOWNLOAD_URL=$FILE_URL" >> $GITHUB_OUTPUT
          echo "EXPIRATION_DATE=$EXP_DATE" >> $GITHUB_OUTPUT

  release:
    needs: [upload-github, upload-mirror]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download ISO Workspace Artifact
        uses: actions/download-artifact@v4
        with:
          name: ark-iso-internal
          path: out/
      - name: Wait for compatible payload publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=pending
          for attempt in $(seq 1 60); do
            STATE=$(gh api 'repos/zamkara/ark-image/actions/workflows/build-payload.yml/runs?branch=main&per_page=1' \
              --jq '.workflow_runs[0] | if .status == "completed" then .conclusion else .status end')
            case "$STATE" in
              success) break ;;
              failure|cancelled|timed_out|action_required|stale)
                echo "Payload publication failed: $STATE" >&2; exit 1 ;;
              *) echo "Waiting for payload publication: $STATE"; sleep 30 ;;
            esac
          done
          [[ "$STATE" == success ]] || { echo 'Timed out waiting for payload publication' >&2; exit 1; }

      - name: Delete existing release if present
        run: gh release delete "build-${{ github.sha }}" --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: "${{ github.sha }}"
          body: |
            # Ark Linux Build ${{ github.sha }}
            
            ---
            
            ## Build Details
            
            **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            
            **Downloads:**
            [Mirror Link](${{ needs.upload-mirror.outputs.DOWNLOAD_URL }})
            > Expires ${{ needs.upload-mirror.outputs.EXPIRATION_DATE }}
            
            ---
            
            ## Installation
            
            Write to a USB device:
            
            ```bash
            sudo dd if=ark-installer.iso of=/dev/sdX bs=4M status=progress && sync
            ```
            
            Replace `/dev/sdX` with your target device (e.g., `/dev/sdb`).
            
            ---
            
            ## Changelog
            
            [View recent commits](https://github.com/${{ github.repository }}/commits/main)
            
          files: out/ark-installer.iso
          prerelease: false
          make_latest: true

  update-cache:
    needs: [check-digest, build-iso]
    if: |
      !cancelled() &&
      needs.check-digest.outputs.needs-build == 'true' &&
      needs.build-iso.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Prepare cache content
        run: |
          {
            echo "${{ needs.check-digest.outputs.digest }}"
            echo "${{ needs.check-digest.outputs.aur-sha }}"
            echo "${{ needs.check-digest.outputs.alga-sha }}"
            date +%s
          } > digest-cache.txt
          cat digest-cache.txt

      - name: Save digest cache
        uses: actions/cache/save@v4
        with:
          path: digest-cache.txt
          key: ${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}
